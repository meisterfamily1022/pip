appId: com.meister23.playmapmobile
name: Release auth interaction regression
---
- launchApp:
    clearState: true
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Email me a code"
    timeout: 10000
- runFlow:
    when:
      visible: "Confirm your email"
    commands:
      - tapOn: "Use a different email"
      - extendedWaitUntil:
          visible: "Create your Pip account"
          timeout: 10000
      - tapOn: "Already have an account? Sign in"
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- tapOn:
    point: "50%,28%"
- assertVisible: "Sign in"
- inputText: "invalid"
- assertVisible: "Sign in"
- eraseText
- tapOn:
    point: "50%,28%"
- inputText: "${PIP_QA_EMAIL}"
- tapOn: "Create an account instead"
- extendedWaitUntil:
    visible: "Create your Pip account"
    timeout: 10000
- assertNotVisible: "Sign in"
- tapOn: "Already have an account? Sign in"
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 10000
- tapOn:
    point: "50%,28%"
- inputText: "${PIP_QA_EMAIL}"
- tapOn: "Email me a code"
- extendedWaitUntil:
    visible: "Confirm your email"
    timeout: 10000
- assertVisible: "Six-digit code"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Confirm your email"
    timeout: 30000
- assertNotVisible: "Sign in"
- tapOn: "Six-digit code"
- inputText: "000000"
- tapOn: "Confirm email"
- extendedWaitUntil:
    visible: ".*That code is incorrect.*"
    timeout: 10000
- tapOn: "Send another code"
- extendedWaitUntil:
    visible: "A new code is on its way. Use the newest code in your email."
    timeout: 10000
- tapOn: "Six-digit code"
- inputText: "${PIP_QA_OTP}"
- tapOn: "Confirm email"
- extendedWaitUntil:
    visible: "Set up Pip"
    timeout: 30000
