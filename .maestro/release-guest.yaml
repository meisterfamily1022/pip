appId: com.meister23.playmapmobile
name: Embedded Release guest onboarding and resume
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Get started"
    timeout: 30000
- tapOn: "Get started"
- assertVisible: "Choose a parent PIN"
- tapOn: "Parent PIN"
- inputText: "2468"
- tapOn: "Continue"
- assertVisible: "Type it once more"
- tapOn: "Confirm parent PIN"
- inputText: "2468"
- tapOn: "Continue"
- assertVisible: "Add a child"
- tapOn: "For example, Ada"
- inputText: "Juniper"
- tapOn: "Next: reading & cleanup"
- assertVisible: "How should toys appear?"
- tapOn: "Add child"
- extendedWaitUntil:
    visible: "Where do toys live?"
    timeout: 10000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Where do toys live?"
    timeout: 30000
- tapOn: "Playroom"
- inputText: "Playroom"
- tapOn: "White shelf"
- inputText: "Shelf"
- tapOn: "Finish setup"
- extendedWaitUntil:
    visible: "Add your first toy"
    timeout: 30000
- assertVisible: "Photograph a shelf"
- assertVisible: "Add one toy by hand"
- tapOn: "I’ll do this later"
- extendedWaitUntil:
    visible: "Finish setting up"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Finish setting up"
    timeout: 30000
