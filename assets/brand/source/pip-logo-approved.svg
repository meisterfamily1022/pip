<svg xmlns="http://www.w3.org/2000/svg" width="2250" height="1350" viewBox="0 0 2250 1350">
  <title>Pip logo — approved redesign artwork</title>
  <desc>The Pip wordmark is "pip" set lowercase in Quicksand Medium, converted to outlines so it rasterises identically without the font installed. The middle letter is a dotless i, so the spark sits on the glyph's own centre axis rather than being nudged into place: a soft yellow dot, with three marks above it — pink at -45 degrees, sage upright, lavender at +45. Letterforms are one blue. The marks keep their own colours and must never inherit the wordmark fill.</desc>

  <!--
    Geometry, in font units at 1000 units per em, measured up from the baseline:

      wordmark advances   p 614 · dotless i 221 · p 614     (total 1449)
      spark axis          centre of the dotless i stem      (x = 725)
      dot                 centre 690 · radius 91
      side marks          centre +/-220 x, 856 y · 206 x 63 · rotated 45
      upright mark        centre 940 y · 63 x 206
      stem top            525          (so the dot clears the stem by 74)

    The spark scales with the wordmark and never moves independently. Clear
    space equals the height of the p bowl on all four sides. Minimum 22pt wide
    for the wordmark; below that, switch to the compact mark.
  -->

  <defs>
    <path id="pip-p" d="M329-525Q397-525 451-491Q505-457 536.500-397Q568-337 568-259Q568-182 536.500-121.500Q505-61 451.500-26.500Q398 8 331 8Q294 8 261.500-3.500Q229-15 202.500-33.500Q176-52 158-75.500Q140-99 132-122L154-136L154 159Q154 176 143 188Q132 200 114 200Q97 200 85.500 188.500Q74 177 74 159L74-480Q74-497 85.500-508.500Q97-520 114-520Q132-520 143-508.500Q154-497 154-480L154-391L139-399Q146-424 163.500-447Q181-470 206.500-487.500Q232-505 263.500-515Q295-525 329-525M320-451Q270-451 231.500-426Q193-401 171.500-358Q150-315 150-259Q150-204 171.500-160Q193-116 231.500-91Q270-66 320-66Q370-66 408-91Q446-116 468-160Q490-204 490-259Q490-315 468-358Q446-401 408-426Q370-451 320-451"/>
    <path id="pip-dotless-i" d="M151-485L151-41Q151-24 139.500-12Q128 0 111 0Q93 0 82-12Q71-24 71-41L71-485Q71-502 82.500-513.500Q94-525 111-525Q128-525 139.500-513.500Q151-502 151-485"/>

    <!-- The spark, drawn about x = 0 on the baseline of whatever it sits over. -->
    <g id="pip-spark">
      <circle cx="0" cy="-690" r="91" fill="#FFDE96"/>
      <rect x="-323" y="-887.5" width="206" height="63" rx="31.5" fill="#F0A9BC" transform="rotate(-45 -220 -856)"/>
      <rect x="-31.5" y="-1043" width="63" height="206" rx="31.5" fill="#B6D9B3"/>
      <rect x="117" y="-887.5" width="206" height="63" rx="31.5" fill="#A98BD4" transform="rotate(45 220 -856)"/>
    </g>

    <g id="pip-spark-monochrome">
      <circle cx="0" cy="-690" r="91" fill="#263B43"/>
      <rect x="-323" y="-887.5" width="206" height="63" rx="31.5" fill="#263B43" transform="rotate(-45 -220 -856)"/>
      <rect x="-31.5" y="-1043" width="63" height="206" rx="31.5" fill="#263B43"/>
      <rect x="117" y="-887.5" width="206" height="63" rx="31.5" fill="#263B43" transform="rotate(45 220 -856)"/>
    </g>
  </defs>

  <!--
    Primary horizontal wordmark. Ink box: x 134..1463, y 57..1300.
    Slice with viewBox="134 57 1329 1243".
  -->
  <g id="main-wordmark" aria-label="pip">
    <g transform="translate(60 1100)" fill="#8FD3EE">
      <use href="#pip-p" x="0"/>
      <use href="#pip-dotless-i" x="614"/>
      <use href="#pip-p" x="835"/>
      <use href="#pip-spark" x="725"/>
    </g>
  </g>

  <!--
    Compact mark: the p and its spark, standing alone, the spark centred on the
    p's own advance. Ink box: x 1674..2168, y 57..1300.
    Slice with viewBox="1674 57 494 1243".
  -->
  <g id="app-icon" aria-label="pip mark">
    <g transform="translate(1600 1100)" fill="#8FD3EE">
      <use href="#pip-p" x="0"/>
      <use href="#pip-spark" x="307"/>
    </g>
  </g>

  <!--
    Single-ink version for embossing and monochrome contexts. Spacing is
    identical to the primary wordmark. Slice with viewBox="134 57 1329 1243"
    after hiding the colour wordmark, or export this group on its own.
  -->
  <g id="monochrome-wordmark" aria-label="pip, one colour" transform="translate(0 1350)" fill="#263B43">
    <g transform="translate(60 1100)">
      <use href="#pip-p" x="0"/>
      <use href="#pip-dotless-i" x="614"/>
      <use href="#pip-p" x="835"/>
      <use href="#pip-spark-monochrome" x="725"/>
    </g>
  </g>
</svg>
